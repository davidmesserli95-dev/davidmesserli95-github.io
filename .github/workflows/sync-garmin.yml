name: Sync Garmin runs

on:
  schedule:
    # Times are UTC: about 7:17 AM and 9:17 PM in Denver (MST).
    - cron: "17 14 * * *"
    - cron: "17 4 * * *"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-garmin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Garmin's Python client
        run: pip install "garmin-connect-personal-api-python==1.0.0"

      - name: Pull runs from Garmin
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: python scripts/sync_garmin.py

      - name: Commit updated runs
        run: |
          if git diff --quiet --exit-code -- data/runs.json 2>/dev/null && git ls-files --error-unmatch data/runs.json >/dev/null 2>&1; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runs.json
          git commit -m "Update runs from Garmin"
          git push
